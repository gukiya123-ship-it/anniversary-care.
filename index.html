<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4F1">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="기념일과 하고 싶은 말을 미리 적어 두면, 때가 되어 선물 후보와 메시지를 함께 알려 주는 앱 — 단일 HTML 웹앱 미리보기">
<title>기념일 챙김 — 웹앱 미리보기</title>
<style>
/* 기념일 챙김 — 단일 HTML 웹앱 스타일 (외부 파일·CDN 없음) */

:root {
  --bg: #f7f4f1;
  --card: #ffffff;
  --border: #e7e0d8;
  --border-strong: #ded5cb;
  --text: #1f2328;
  --sub: #6b6660;
  --faint: #8b857e;
  --accent: #b4553f;
  --accent-deep: #9c4632;
  --accent-tint: #f7e9e4;
  --accent-tint-border: #eed7ce;
  --mild: #3f6e5a;
  --mild-tint: #e7f0eb;
  --mild-tint-border: #d3e3da;
  --warn: #8a5a00;
  --warn-tint: #fff3da;
  --sensitive: #4b5563;
  --sensitive-tint: #edeef1;
  --sensitive-tint-border: #dcdfe4;
  --radius-lg: 18px;
  --radius-md: 12px;
  --shadow-card: 0 1px 2px rgba(31, 35, 40, 0.04);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #e9e2da;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR",
    "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: stretch;
  overflow: hidden;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

p {
  margin: 0;
}

h1,
h2,
h3 {
  margin: 0;
}

/* ---------- 휴대폰 프레임 ---------- */

.device {
  position: relative;
  width: 100%;
  max-width: 412px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 480px) and (min-height: 640px) {
  body {
    padding: 20px;
    align-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #f0eae3 0%, #e3d9ce 100%);
  }

  .device {
    height: min(880px, calc(100dvh - 40px));
    border-radius: 30px;
    box-shadow: 0 24px 60px rgba(31, 35, 40, 0.18), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
    border: 1px solid rgba(31, 35, 40, 0.08);
  }
}

/* ---------- 상단 바 ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 16px 16px 10px;
  background: rgba(247, 244, 241, 0.94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(231, 224, 216, 0.9);
  flex: 0 0 auto;
  z-index: 5;
}

.topbar-title {
  flex: 1;
  min-width: 0;
}

.topbar h1 {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar p {
  margin-top: 3px;
  font-size: 12.5px;
  color: var(--sub);
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-btn {
  width: 36px;
  height: 36px;
  margin-left: -6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--accent);
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

.icon-btn:active {
  background: rgba(180, 85, 63, 0.1);
}

.topbar-link {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  padding: 6px 4px;
  flex: 0 0 auto;
}

/* ---------- 본문 ---------- */

.screen {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--sub);
  letter-spacing: 0.2px;
  padding: 2px 2px 0;
}

.section-title-extra {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--faint);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow-card);
}

.card--tint {
  background: var(--accent-tint);
  border-color: var(--accent-tint-border);
}

.card--mild {
  background: var(--mild-tint);
  border-color: var(--mild-tint-border);
}

.card--sensitive {
  background: var(--sensitive-tint);
  border-color: var(--sensitive-tint-border);
}

.note {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--sub);
}

.note--warn {
  color: var(--warn);
}

.note--accent {
  color: var(--accent-deep);
}

.hint {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--faint);
}

.empty-title {
  font-size: 16px;
  font-weight: 700;
}

.form-error {
  background: #fdeceb;
  border: 1px solid #f3c9c4;
  color: #a33526;
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 600;
}

/* ---------- 버튼 ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  transition: transform 0.08s ease, opacity 0.15s ease;
}

.btn:active {
  transform: translateY(1px);
  opacity: 0.92;
}

.btn--secondary {
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--accent);
}

.btn--ghost {
  background: transparent;
  color: var(--sub);
  padding: 10px 16px;
  font-size: 14px;
}

.btn--danger {
  background: #b3261e;
}

.link-btn {
  align-self: flex-start;
  padding: 6px 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.link-btn--muted {
  color: var(--sub);
  font-weight: 600;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  font-size: 13.5px;
  font-weight: 600;
  transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}

.chip[aria-pressed="true"] {
  background: var(--accent-tint);
  border-color: var(--accent);
  color: var(--accent-deep);
}

/* ---------- 입력 ---------- */

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.field--half {
  flex: 1;
}

.field-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--sub);
}

.input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
  padding: 11px 12px;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.4;
  color: var(--text);
  appearance: none;
  -webkit-appearance: none;
}

.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(180, 85, 63, 0.12);
}

.input--area {
  min-height: 76px;
  resize: none;
  line-height: 1.5;
}

.input--select {
  background-image: linear-gradient(45deg, transparent 50%, #9a938b 50%),
    linear-gradient(135deg, #9a938b 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}

.input--placeholder {
  color: var(--faint);
}

.row-2 {
  display: flex;
  gap: 10px;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0;
}

.switch-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  width: 46px;
  height: 27px;
  flex: 0 0 auto;
  border-radius: 999px;
  background: #dcd6cf;
  transition: background 0.16s ease;
  margin: 0;
}

.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(31, 35, 40, 0.25);
  transition: transform 0.16s ease;
}

.switch:checked {
  background: var(--accent);
}

.switch:checked::after {
  transform: translateX(19px);
}

.preview-box {
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: #f2f0ee;
  border-radius: var(--radius-md);
  padding: 11px 12px;
}

.preview-label {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--sub);
}

.preview-value {
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.45;
}

.preview-value--warn {
  color: var(--warn);
}

/* ---------- 홈 ---------- */

.row-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: transform 0.08s ease, border-color 0.12s ease;
}

.row-card:active {
  transform: scale(0.995);
  border-color: var(--border-strong);
}

.row-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.row-title-wrap {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.row-title {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.3;
}

.row-meta {
  font-size: 12.5px;
  color: var(--sub);
}

.row-date {
  font-size: 12.5px;
  color: var(--faint);
  line-height: 1.45;
}

.row-foot {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}

.row-foot svg {
  width: 14px;
  height: 14px;
}

.row-foot--muted {
  color: var(--faint);
  font-weight: 600;
}

.row-foot--sensitive {
  color: var(--sensitive);
}

.dday {
  flex: 0 0 auto;
  font-size: 12.5px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 999px;
  background: #efeae4;
  color: var(--accent);
  white-space: nowrap;
}

.dday--soon {
  background: var(--accent-tint);
}

.dday--today {
  background: var(--accent);
  color: #fff;
}

.dday--muted {
  background: #ececec;
  color: var(--faint);
}

.due-card .dday {
  background: #fff;
}

.due-card .dday--today {
  background: var(--accent);
  color: #fff;
}

.due-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.preview-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  background: linear-gradient(135deg, #fff8f5 0%, #f7e9e4 100%);
  border: 1px solid var(--accent-tint-border);
  border-radius: var(--radius-lg);
  padding: 14px 44px 14px 16px;
  box-shadow: var(--shadow-card);
}

.preview-card:active {
  transform: scale(0.995);
}

.preview-eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: var(--accent);
}

.preview-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.2px;
}

.preview-sub {
  font-size: 12.5px;
  color: var(--sub);
  line-height: 1.45;
}

.preview-arrow {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
}

.preview-arrow svg {
  width: 20px;
  height: 20px;
}

/* ---------- 상세 / 알림 공통 ---------- */

.date-big {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.35;
}

.badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 800;
}

.tag {
  display: inline-block;
  background: #f2f4f3;
  color: var(--mild);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
}

.tag--soft {
  background: #efeae4;
  color: var(--sub);
  font-weight: 700;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.message {
  background: #f7f4f1;
  border: 1px solid #efe9e3;
  border-radius: var(--radius-md);
  padding: 12px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-line;
  word-break: break-word;
}

.gift-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-card);
}

.gift-card--primary {
  background: #fffdfb;
  border: 1.5px solid var(--accent);
}

.gift-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.gift-title {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.35;
}

.gift-title--lg {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.4px;
}

.gift-price {
  flex: 0 0 auto;
  font-size: 14px;
  font-weight: 700;
}

.gift-desc {
  font-size: 12.5px;
  color: var(--sub);
  line-height: 1.55;
}

.reason {
  background: var(--accent-tint);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.55;
  color: #6b3a2c;
}

.selected-gift {
  background: #fbf8f6;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.link-row {
  display: flex;
  gap: 16px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f0ebe5;
}

.history-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.history-text {
  min-width: 0;
}

.history-title {
  font-size: 14.5px;
  font-weight: 600;
}

.status-line {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--mild);
}

/* ---------- 알림 히어로 ---------- */

.hero {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: linear-gradient(150deg, #fff6f2 0%, var(--accent-tint) 100%);
  border: 1px solid var(--accent-tint-border);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  box-shadow: var(--shadow-card);
}

.hero--sensitive {
  background: linear-gradient(150deg, #f6f6f8 0%, var(--sensitive-tint) 100%);
  border-color: var(--sensitive-tint-border);
}

.hero-dday {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -1.2px;
  color: var(--accent);
  line-height: 1.1;
}

.hero--sensitive .hero-dday {
  color: var(--sensitive);
}

.hero-date {
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  text-align: right;
  line-height: 1.4;
}

.hero-desc {
  font-size: 12.5px;
  color: var(--sub);
  line-height: 1.5;
}

.status-chip {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(180, 85, 63, 0.12);
  color: var(--accent-deep);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 700;
}

.status-chip svg {
  width: 13px;
  height: 13px;
}

.status-chip--muted {
  background: rgba(107, 102, 96, 0.12);
  color: var(--sub);
}

/* ---------- 설정 ---------- */

.info {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--sub);
}

/* ---------- 탭 바 ---------- */

.tabbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}

.tabbar[hidden] {
  display: none;
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0 4px;
  color: #9a938b;
  font-size: 11px;
  font-weight: 700;
  border-radius: 12px;
}

.tab svg {
  width: 22px;
  height: 22px;
}

.tab[aria-current="page"] {
  color: var(--accent);
}

/* ---------- 모달 ---------- */

.modal-layer {
  position: absolute;
  inset: 0;
  z-index: 20;
}

.modal-layer[hidden] {
  display: none;
}

.backdrop {
  position: absolute;
  inset: 0;
  background: rgba(31, 35, 40, 0.42);
  animation: fade-in 0.18s ease-out;
}

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 30px rgba(31, 35, 40, 0.18);
  animation: sheet-up 0.22s cubic-bezier(0.22, 0.8, 0.3, 1);
  overflow: hidden;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 15px 16px 11px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.sheet-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sheet-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.manual-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
}

.manual-title {
  font-size: 13.5px;
  font-weight: 700;
}

.confirm-body,
.info-body {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--sub);
  white-space: pre-line;
}

.link-target {
  font-size: 16px;
  font-weight: 700;
}

.link-copy-note .note {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 600;
}

.link-copy-note .note svg {
  width: 13px;
  height: 13px;
  flex: none;
}

.link-alt {
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  color: var(--sub);
}

.link-alt a {
  color: var(--accent);
  font-weight: 700;
  text-decoration: underline;
}

.url-box {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--sub);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  word-break: break-all;
}

.kakao {
  background: #fee500;
  border-radius: 14px;
  padding: 13px 14px;
  color: #3c1e1e;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.kakao-title {
  font-size: 13.5px;
  font-weight: 800;
  margin-bottom: 6px;
}

.kakao-body {
  font-size: 12.5px;
  line-height: 1.6;
  white-space: pre-line;
}

/* ---------- 토스트 ---------- */

.toast {
  position: absolute;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translate(-50%, 10px);
  max-width: 82%;
  background: rgba(31, 35, 40, 0.92);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  padding: 10px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 30;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@keyframes sheet-up {
  from {
    transform: translateY(18%);
    opacity: 0.6;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001s !important;
    transition-duration: 0.001s !important;
  }
}

<script>
/*!
 * 기념일 챙김 (가칭) — 웹앱 공용 로직
 *
 * Expo 앱(projects/anniversary-care)의 src/utils/*, src/store/* 를 브라우저에서
 * 그대로 돌아가도록 옮긴 것이다. DOM 을 건드리지 않으므로 Node 에서 그대로 검증한다.
 *
 * 의존: 앞에서 정의되는 GIFT_CATALOG_DATA(선물 24개), KoreanLunarCalendar(음력 변환)
 */
var ANN = (function () {
  'use strict';

  /* ======================================================================
   * 1) 날짜 — 모든 계산은 "날짜만"(YYYY-MM-DD) 다룬다.
   * ==================================================================== */

  var DAY_MS = 24 * 60 * 60 * 1000;
  var WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  var ISO_PATTERN = /^(\d{4})-(\d{2})-(\d{2})$/;

  function isInt(n) {
    return typeof n === 'number' && isFinite(n) && Math.floor(n) === n;
  }

  function daysInMonth(year, month) {
    return new Date(Date.UTC(year, month, 0)).getUTCDate();
  }

  function isLeapYear(year) {
    return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  }

  function pad2(n) {
    var s = String(n);
    return s.length < 2 ? '0' + s : s;
  }

  function pad4(n) {
    var s = String(n);
    while (s.length < 4) s = '0' + s;
    return s;
  }

  function toISODate(parts) {
    return pad4(parts.year) + '-' + pad2(parts.month) + '-' + pad2(parts.day);
  }

  function parseISODate(value) {
    var m = ISO_PATTERN.exec(value);
    if (!m) throw new Error('올바른 날짜 형식이 아니에요: ' + value);
    return { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]) };
  }

  function isValidISODate(value) {
    if (typeof value !== 'string') return false;
    var m = ISO_PATTERN.exec(value);
    if (!m) return false;
    var year = Number(m[1]);
    var month = Number(m[2]);
    var day = Number(m[3]);
    if (month < 1 || month > 12 || day < 1) return false;
    return day <= daysInMonth(year, month);

  function todayISO(now) {
    var d = now || new Date();
    return toISODate({ year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() });
  }

  function toUTC(iso) {
    var p = parseISODate(iso);
    return Date.UTC(p.year, p.month - 1, p.day);
  }

  function addDays(iso, days) {

    return toISODate({ year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate() });
  }

  function daysBetween(from, to) {

  }

  function weekdayOf(iso) {
    var p = parseISODate(iso);
    return WEEKDAY_KO[new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay()];

    var p = parseISODate(iso);
    return p.year + '년 ' + p.month + '월 ' + p.day + '일 (' + weekdayOf(iso) + ')';

  function formatMonthDay(month, day) {
    return month + '월 ' + day + '일';
  }

  /* ======================================================================
   * 2) 음력 → 양력 (매년 반복되는 기념일)
   *
   * 변환은 korean-lunar-calendar(MIT, 1890~2050)를 인라인 번들로 그대로 쓴다.
   * 이 모듈이 더하는 것은 "매년 반복" 규칙이다.
   *   1) 음력 기념일을 그 해 양력으로 (음력 12월 → 다음 해 양력 1~2월)
   *   2) 윤달 기념일: 그 해에 윤달이 없으면 평달로 대체
   *   3) 음력 30일이 없는 달: 그 달 마지막 날(29일)로 대체

    if (!lunarYearInRange(year)) return null;

    if (isSensitive) {
      notice = '마음을 조용히 전하는 자리예요. 선물 후보 없이 미리 적어 둔 말만 보여 드려요.';
    } else if (!(a.selectedGiftTitle || a.selectedGiftId)) {
      notice = '아직 미리 골라 둔 선물이 없어요. 후보 3개 중에서 하나를 골라 두면 D-7 알림에서 바로 열 수 있어요.';
    }

    return {
      anniversary: a,
      occurrence: occurrence,
      daysUntil: daysUntil,
      dday: daysUntil === null ? '—' : ddayLabel(daysUntil),
      dateText: occurrence ? formatKoreanDate(occurrence.solar) : '날짜를 계산할 수 없어요',
      dateDescription: occurrence ? describeOccurrence(rule, occurrence) : '날짜 정보를 확인해 주세요',
      isDue: isDue,
      isSensitive: isSensitive,
      selectedGift: isSensitive ? null : buildSelectedGiftView(a),
      alternatives: alternatives,
      notice: notice,
      messageText: buildMessageText(a)
    };
  }

  function listUpcoming(anniversaries, fromISO) {
    var from = fromISO || todayISO();
    var items = anniversaries.map(function (a) {
      var rule = anniversaryRule(a);
      var occurrence = nextOccurrence(rule, from);
      var daysUntil = occurrence ? daysBetween(from, occurrence.solar) : null;
      return {
        anniversary: a,
        occurrence: occurrence,
        daysUntil: daysUntil,
        dday: daysUntil === null ? '—' : ddayLabel(daysUntil),
        dateText: occurrence ? formatKoreanDate(occurrence.solar) : '날짜 확인 필요',
        dateDescription: occurrence ? describeOccurrence(rule, occurrence) : '',
        isSensitive: Boolean(a.isSensitive) || a.occasion === 'memorial',
        hasSelectedGift: Boolean(a.selectedGiftTitle || a.selectedGiftId)
      };
    });

    items.sort(function (x, y) {
      var dx = x.daysUntil === null ? Number.MAX_SAFE_INTEGER : x.daysUntil;
      var dy = y.daysUntil === null ? Number.MAX_SAFE_INTEGER : y.daysUntil;
      if (dx !== dy) return dx - dy;
      return x.anniversary.personName < y.anniversary.personName ? -1 : 1;
    });
    return items;
  }

  function listDueSoon(anniversaries, fromISO) {
    return listUpcoming(anniversaries, fromISO).filter(function (item) {
      return item.daysUntil !== null && item.daysUntil >= 0 && item.daysUntil <= item.anniversary.reminderDaysBefore;
    });
  }

  /* ======================================================================
   * 5) 카카오톡 '나에게 보내기' (스텁 — 실제 전송은 연결 전)
   * ==================================================================== */

  var KAKAO_MEMO_SETUP_NOTE =
    '카카오 developers 에서 앱을 만들고 카카오 로그인 + talk_message 동의항목을 받은 뒤, REST API 키를 넣고 토큰 교환을 서버(Edge Function)에서 처리하면 버튼이 켜져요. 지금은 보낼 내용만 미리 보여 드려요.';

  function buildKakaoMemoPayload(plan) {
    var a = plan.anniversary;
    var rule = anniversaryRule(a);
    var sub = ruleLabel(rule);
    if (plan.occurrence && plan.occurrence.leapMonthFallback) sub += ' · 윤달이 없는 해라 평달로 계산';
    if (plan.occurrence && plan.occurrence.dayAdjusted) {
      sub += ' · ' + plan.occurrence.requestedDay + '일이 없어 ' + plan.occurrence.actualDay + '일로 계산';
    }
    var lines = [plan.dday + ' · ' + plan.dateText, sub];
    if (plan.selectedGift && plan.selectedGift.title) lines.push('미리 골라 둔 선물: ' + plan.selectedGift.title);
    lines.push(plan.messageText);

    return {
      anniversaryId: a.id,
      title: anniversaryTitle(a) + ' ' + plan.dday,
      body: lines.join('\n'),
      dday: plan.dday,
      dateText: plan.dateText,
      selectedGiftTitle: plan.selectedGift ? plan.selectedGift.title : undefined,
      selectedGiftUrl: plan.selectedGift ? plan.selectedGift.url : undefined,
      buttonLabel: plan.selectedGift && plan.selectedGift.url ? '고른 선물 보기' : '기념일 열기'

  function sendKakaoMemoToMe(payload, options) {
    var configured = Boolean(options && options.restApiKey);

      return {
        status: 'not_configured',
        message:
          '카카오 연동이 아직 설정되지 않았어요.\n' + KAKAO_MEMO_SETUP_NOTE +
          '\n\n보내려는 내용은 아래와 같아요.\n\n[' + payload.title + ']\n' + payload.body
      };
    }
    return { status: 'failed', message: '카카오 키는 설정되어 있지만 전송 서버가 아직 연결되지 않았어요.' };
  }

  /* ======================================================================
   * 6) 개인정보 — 연락처는 저장하지 않는다
   * ==================================================================== */

  var CONTACT_FIELD_PATTERNS = [
    { name: 'phone', pattern: /(^|_|\b)(phone|mobile|tel|msisdn)(_?number)?($|_|\b)/i },
    { name: 'contact', pattern: /(contact|연락처|전화번호|휴대폰)/i },
    { name: 'email', pattern: /(e-?mail|메일)/i },
    { name: 'address', pattern: /(address|주소|배송지)/i },
    { name: 'kakao', pattern: /(kakao|카카오)[\s_-]?(id|talk|톡|채널)/i }
  ];

  function findContactFields(input) {
    var found = [];
    for (var key in input) {
      if (!Object.prototype.hasOwnProperty.call(input, key)) continue;
      for (var i = 0; i < CONTACT_FIELD_PATTERNS.length; i += 1) {
        if (CONTACT_FIELD_PATTERNS[i].pattern.test(key)) {
          found.push(key);
          break;
        }
      }
    }
    return found;
  }

  function assertNoContactFields(input) {
    var found = findContactFields(input || {});
    if (found.length > 0) {
      throw new Error('연락처 정보는 저장할 수 없어요: ' + found.join(', '));
    }
  }

  /* ======================================================================
   * 7) 저장소 (localStorage → 실패하면 메모리)
   * ==================================================================== */

  var STORAGE_KEY = 'anniversary-care/state/v1';

  var DEFAULT_SETTINGS = {
    defaultReminderDaysBefore: 7,
    defaultBudget: 50000,
    kakaoMemoLinked: false
  };

  function makeMemoryStorage() {
    var data = {};
    return {
      kind: 'memory',
      getItem: function (key) {
        return Object.prototype.hasOwnProperty.call(data, key) ? data[key] : null;

      setItem: function (key, value) {

  }

        kind: 'localStorage',
        getItem: function (key) { return ls.getItem(key); },
        setItem: function (key, value) { ls.setItem(key, value); },

    }
  }

  function newId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function makeAnniversary(draft, settings, now) {
    var stamp = now || todayISO();
    var selected = getGiftById(draft.selectedGiftId);

      id: draft.id || newId(),
      personName: String(draft.personName || '').replace(/^\s+|\s+$/g, ''),
      relation: draft.relation,
      occasion: draft.occasion,

      selectedGiftId: draft.selectedGiftId,
      selectedGiftTitle: draft.selectedGiftTitle || (selected ? selected.title : undefined),
      selectedGiftUrl: draft.selectedGiftUrl || (selected ? selected.url : undefined),
      reminderDaysBefore: draft.reminderDaysBefore || settings.defaultReminderDaysBefore,

  }

  function seedState() {
    var settings = {
      defaultReminderDaysBefore: DEFAULT_SETTINGS.defaultReminderDaysBefore,
      defaultBudget: DEFAULT_SETTINGS.defaultBudget,
      kakaoMemoLinked: DEFAULT_SETTINGS.kakaoMemoLinked
    };
    var seeds = [
      {
        personName: '엄마',
        relation: 'parent',
        occasion: 'birthday',
        title: '엄마 생신',
        month: 12,
        day: 30,
        isLunar: true,
        isLeapMonth: false,
        tasteMemo: '허리가 아프시고 따뜻한 차를 좋아하심. 안마기 좋아하실 듯.',
        messageDraft: '올해도 건강하게 오래오래 계세요.',
        budget: 60000,
        selectedGiftId: 'parent-01'
      },
      {
        personName: '민준',
        relation: 'partner',
        occasion: 'anniversary',
        title: '우리 결혼기념일',
        month: 3,
        day: 14,
        isLunar: false,
        tasteMemo: '향 좋은 걸 좋아하고 홈카페를 즐김. 커피도 좋아함.',
        messageDraft: '같이 걸어온 시간이 고마워. 앞으로도 잘 부탁해.',
        budget: 100000
      },
      {
        personName: '지수',
        relation: 'friend',
        occasion: 'birthday',
        title: '지수 생일',
        month: 11,
        day: 28,
        isLunar: false,
        tasteMemo: '보드는 좋아하지만 요즘은 전시 보러 다니는 중.',
        messageDraft: '생일 축하해! 조만간 전시 같이 보러 가자.',
        budget: 40000
      },
      {
        personName: '할머니',
        relation: 'parent',
        occasion: 'memorial',
        title: '할머니 기일',
        month: 9,
        day: 9,
        isLunar: true,
        messageDraft: '할머니, 잘 지내고 있어요. 오늘은 조용히 기억할게요.',
        budget: 0
      }
    ];
    var anniversaries = [];
    for (var i = 0; i < seeds.length; i += 1) {
      anniversaries.push(makeAnniversary(seeds[i], settings, todayISO()));
    }

  }

  function cloneState(state) {
    return JSON.parse(JSON.stringify(state));
  }

  function createStore(options) {
    var opts = options || {};
    var storage = detectStorage(opts.storage);
    var state;
    var persistOk = true;
    var listeners = [];

    function notify() {
      for (var i = 0; i < listeners.length; i += 1) listeners[i](state);
    }

    function save() {
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(state));
        persistOk = true;
      } catch (error) {

      }

    function load() {
      var raw = null;
      try {
        raw = storage.getItem(STORAGE_KEY);
      } catch (error) {
        raw = null;
      }

        try {
          var parsed = JSON.parse(raw);

            var settings = {};
            var key;
            for (key in DEFAULT_SETTINGS) {
              if (Object.prototype.hasOwnProperty.call(DEFAULT_SETTINGS, key)) settings[key] = DEFAULT_SETTINGS[key];

              }
            }
            return {
              anniversaries: parsed.anniversaries.map(function (a) {
                var copy = {};
                for (var k in a) {
                  if (Object.prototype.hasOwnProperty.call(a, k)) copy[k] = a[k];
                }
                if (!copy.giftHistory) copy.giftHistory = [];
                /* 카탈로그 상품이면 저장된 주소를 현재 카탈로그 링크로 맞춘다(예전 자리표시자 정리). */
                if (copy.selectedGiftId) {
                  var migratedGift = getGiftById(copy.selectedGiftId);
                  if (migratedGift && copy.selectedGiftUrl !== migratedGift.url) copy.selectedGiftUrl = migratedGift.url;
                }

              }),
              settings: settings
            };
          }

          /* 깨진 저장값은 버리고 시드로 시작한다. */
        }

    }

      state = seedState();
      save();
    }

      storageKind: storage.kind,
      getState: function () { return state; },
      isPersisting: function () { return persistOk; },
      subscribe: function (fn) {

          var i = listeners.indexOf(fn);

      getAnniversary: function (id) {
        if (!id) return undefined;
        for (var i = 0; i < state.anniversaries.length; i += 1) {
          if (state.anniversaries[i].id === id) return state.anniversaries[i];
        }
        return undefined;
      },
      addAnniversary: function (draft) {
        assertNoContactFields(draft);
        if (!String(draft.personName || '').replace(/\s/g, '')) throw new Error('이름을 입력해 주세요.');
        var created = makeAnniversary(draft, state.settings, todayISO());

      },
      updateAnniversary: function (id, patch) {
        assertNoContactFields(patch);
        state.anniversaries = state.anniversaries.map(function (a) {
          if (a.id !== id) return a;
          var next = {};
          for (var k in a) {
            if (Object.prototype.hasOwnProperty.call(a, k)) next[k] = a[k];
          }
          for (var p in patch) {
            if (Object.prototype.hasOwnProperty.call(patch, p)) next[p] = patch[p];

          next.updatedAt = todayISO();

        notify();

        notify();

          if (a.id !== id) return a;
          var next = {};
          for (var k in a) {
            if (Object.prototype.hasOwnProperty.call(a, k)) next[k] = a[k];
          }

          next.selectedGiftTitle = gift ? gift.title : undefined;
          next.selectedGiftUrl = gift ? gift.url : undefined;

        });

        notify();
      },

          if (a.id !== id) return a;

          for (var k in a) {
            if (Object.prototype.hasOwnProperty.call(a, k)) next[k] = a[k];

          var item = {
            id: newId(),
            giftTitle: entry.giftTitle,
            priceWon: entry.priceWon,
            givenOn: entry.givenOn,
            giftId: entry.giftId,
            memo: entry.memo

          next.giftHistory = [item].concat(a.giftHistory || []);
          next.updatedAt = todayISO();
          return next;
        });
        save();
        notify();
      },
      removeGiftHistory: function (id, entryId) {
        state.anniversaries = state.anniversaries.map(function (a) {
          if (a.id !== id) return a;
          var next = {};
          for (var k in a) {
            if (Object.prototype.hasOwnProperty.call(a, k)) next[k] = a[k];
          }
          next.giftHistory = (a.giftHistory || []).filter(function (e) { return e.id !== entryId; });

        });
        save();
        notify();
      },
      updateSettings: function (patch) {
        var next = {};
        for (var k in state.settings) {
          if (Object.prototype.hasOwnProperty.call(state.settings, k)) next[k] = state.settings[k];
        }
        for (var p in patch) {
          if (Object.prototype.hasOwnProperty.call(patch, p)) next[p] = patch[p];
        }
        state.settings = next;
        save();
        notify();
      },
      resetAll: function () {
        state = seedState();
        save();
        notify();
      },
      clearAll: function () {
        state.anniversaries = [];
        save();
        notify();
      }

  }

    // datetime
    daysInMonth: daysInMonth,
    isLeapYear: isLeapYear,
    toISODate: toISODate,
    parseISODate: parseISODate,
    isValidISODate: isValidISODate,
    todayISO: todayISO,
    addDays: addDays,
    daysBetween: daysBetween,
    weekdayOf: weekdayOf,
    formatKoreanDate: formatKoreanDate,
    formatMonthDay: formatMonthDay,
    // lunar
    LUNAR_MIN_YEAR: LUNAR_MIN_YEAR,
    LUNAR_MAX_YEAR: LUNAR_MAX_YEAR,
    lunarToSolar: lunarToSolar,
    solarToLunar: solarToLunar,
    hasLeapMonth: hasLeapMonth,
    lunarMonthLength: lunarMonthLength,
    resolveOccurrence: resolveOccurrence,
    nextOccurrence: nextOccurrence,
    upcomingOccurrences: upcomingOccurrences,
    daysUntilOccurrence: daysUntilOccurrence,
    ddayLabel: ddayLabel,
    ruleLabel: ruleLabel,
    describeOccurrence: describeOccurrence,
    isLeapDayRule: isLeapDayRule,
    // gifts
    GIFT_CATALOG: GIFT_CATALOG,
    BLOCKED_KEYWORDS: BLOCKED_KEYWORDS,
    SENSITIVE_OCCASION_NOTICE: SENSITIVE_OCCASION_NOTICE,
    NO_CANDIDATE_NOTICE: NO_CANDIDATE_NOTICE,
    budgetBand: budgetBand,
    formatWon: formatWon,
    hasBlockedKeyword: hasBlockedKeyword,
    isSensitiveInput: isSensitiveInput,
    matchGifts: matchGifts,
    matchAlternatives: matchAlternatives,
    getGiftById: getGiftById,
    validateGiftCatalog: validateGiftCatalog,
    // reminder
    AFFILIATE_DISCLOSURE: AFFILIATE_DISCLOSURE,
    TEST_GIFT_LINK_NOTE: TEST_GIFT_LINK_NOTE,
    isKakaoGiftUrl: isKakaoGiftUrl,
    MANUAL_PAYMENT_NOTICE: MANUAL_PAYMENT_NOTICE,
    RELATION_LABELS: RELATION_LABELS,
    OCCASION_LABELS: OCCASION_LABELS,
    PRICE_BAND_LABELS: PRICE_BAND_LABELS,
    anniversaryRule: anniversaryRule,
    anniversaryTitle: anniversaryTitle,
    buildMessageText: buildMessageText,
    buildReminder: buildReminder,
    listUpcoming: listUpcoming,
    listDueSoon: listDueSoon,
    // kakao
    KAKAO_MEMO_SETUP_NOTE: KAKAO_MEMO_SETUP_NOTE,
    buildKakaoMemoPayload: buildKakaoMemoPayload,
    sendKakaoMemoToMe: sendKakaoMemoToMe,
    // privacy
    findContactFields: findContactFields,
    assertNoContactFields: assertNoContactFields,
    // store
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    STORAGE_KEY: STORAGE_KEY,
    createStore: createStore,
    seedState: seedState,
    makeAnniversary: makeAnniversary,
    newId: newId
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = ANN;
}

      '<path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>',
    gift:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M5 9.2h14v9.9H5z"/><path d="M5 13h14"/><path d="M12 9.2v9.9"/></svg>',
    check:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M5 12.6 9.4 17 19 7.4"/></svg>'
  };

  function card(inner, tone) {
    return '<section class="card' + (tone ? ' card--' + tone : '') + '">' + inner + '</section>';
  }

  function sectionTitle(text, extra) {
    return '<h2 class="section-title">' + esc(text) + (extra ? '<span class="section-title-extra">' + esc(extra) + '</span>' : '') + '</h2>';
  }

  function note(text, tone) {
    return '<p class="note' + (tone ? ' note--' + tone : '') + '">' + esc(text) + '</p>';
  }

  function noteHtml(html) {
    return '<p class="note">' + html + '</p>';
  }

  function ddayBadge(item) {
    var tone = 'default';
    if (item.daysUntil === null) tone = 'muted';
    else if (item.daysUntil === 0) tone = 'today';
    else if (item.daysUntil <= 7) tone = 'soon';
    return '<span class="dday dday--' + tone + '">' + esc(item.dday) + '</span>';
  }

  function button(label, attrs, variant) {
    return (
      '<button type="button" class="btn' + (variant ? ' btn--' + variant : '') + '" ' + attrs + '>' + label + '</button>'
    );
  }

  function chips(options, current, action, extraAttrs) {
    return (
      '<div class="chips">' +
      options
        .map(function (opt) {
          var active = String(opt.value) === String(current);
          return (
            '<button type="button" class="chip" aria-pressed="' + (active ? 'true' : 'false') + '" data-action="' +
            action + '" data-value="' + esc(opt.value) + '"' + (extraAttrs || '') + '>' + esc(opt.label) + '</button>'
          );
        })
        .join('') +
      '</div>'
    );
  }

  function fieldText(options) {
    var id = options.id;
    var multiline = options.multiline;
    var value = options.value === undefined || options.value === null ? '' : String(options.value);
    var input = multiline
      ? '<textarea id="' + id + '" class="input input--area" rows="' + (options.rows || 3) + '" placeholder="' +
        esc(options.placeholder || '') + '">' + esc(value) + '</textarea>'
      : '<input id="' + id + '" class="input" type="' + (options.type || 'text') + '" value="' + esc(value) +
        '" placeholder="' + esc(options.placeholder || '') + '"' +
        (options.inputmode ? ' inputmode="' + options.inputmode + '"' : '') + '>';
    return (
      '<div class="field">' +
      '<label class="field-label" for="' + id + '">' + esc(options.label) + '</label>' +
      input +
      (options.hint ? '<p class="hint">' + esc(options.hint) + '</p>' : '') +
      '</div>'
    );
  }

  function fieldSwitch(id, label, hint, checked) {
    return (
      '<label class="switch-row" for="' + id + '">' +
      '<span class="switch-text"><span class="field-label">' + esc(label) + '</span>' +
      (hint ? '<span class="hint" id="' + (id === 'f-lunar' ? 'leap-hint' : '') + '">' + esc(hint) + '</span>' : '') +
      '</span>' +
      '<input type="checkbox" class="switch" id="' + id + '"' + (checked ? ' checked' : '') + '>' +
      '</label>'
    );
  }

  function selectField(id, label, value, options, placeholder) {
    return (
      '<div class="field field--half">' +
      '<label class="field-label" for="' + id + '">' + esc(label) + '</label>' +
      '<select id="' + id + '" class="input input--select' + (value ? '' : ' input--placeholder') + '">' +
      '<option value=""' + (value ? '' : ' selected') + '>' + esc(placeholder) + '</option>' +
      options
        .map(function (opt) {
          return '<option value="' + opt + '"' + (String(value) === String(opt) ? ' selected' : '') + '>' + opt + '</option>';
        })
        .join('') +
      '</select></div>'
    );
  }

  function messageBlock(text) {
    return '<div class="message">' + esc(text) + '</div>';
  }

  function affiliateTag(isAffiliate) {
    return isAffiliate ? '<span class="tag tag--soft">제휴 링크</span>' : '';
  }

  function giftCardHtml(rec, actionAttrs, actionLabel) {
    var gift = rec.gift;
    return (
      '<article class="gift-card">' +
      '<div class="gift-head"><h3 class="gift-title">' + esc(gift.title) + '</h3>' +
      '<span class="gift-price">' + esc(A.formatWon(gift.priceWon)) + '</span></div>' +
      '<p class="gift-desc">' + esc(gift.description) + '</p>' +
      (rec.reason ? '<p class="reason">' + esc(rec.reason) + '</p>' : '') +
      '<div class="tag-row">' + affiliateTag(gift.isAffiliate) +
      gift.tasteTags.slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '</div>' +
      (actionLabel ? '<button type="button" class="link-btn" ' + actionAttrs + '>' + esc(actionLabel) + '</button>' : '') +
      '</article>'
    );
  }

  /* ------------------------------------------------------------------
   * 화면 ① 홈
   * ---------------------------------------------------------------- */

  function renderHomeScreen(data, today) {
    var anniversaries = data.anniversaries || [];
    var upcoming = A.listUpcoming(anniversaries, today);
    var dueSoon = A.listDueSoon(anniversaries, today);
    var out = [];

    if (dueSoon.length > 0) {
      out.push(sectionTitle('지금 알림이 나갈 기념일', dueSoon.length + '건'));
      dueSoon.forEach(function (item) {
        var a = item.anniversary;
        out.push(
          '<div class="card card--tint due-card">' +
            '<div class="row-head">' +
            '<div><p class="row-title">' + esc(A.anniversaryTitle(a)) + '</p>' +
            '<p class="row-meta">' + esc(item.dateText) + ' · ' + esc(A.RELATION_LABELS[a.relation]) + '</p></div>' +
            ddayBadge(item) +
            '</div>' +
            '<p class="note">알림 시점 D-' + a.reminderDaysBefore + '이 되어 이 화면이 열렸어요.</p>' +
            button('알림 화면 열기', 'data-nav="reminder" data-id="' + esc(a.id) + '"') +
            '</div>'
        );
      });
    }

    if (upcoming.length > 0 && dueSoon.length === 0) {
      var nearest = upcoming[0];
      out.push(
        '<button type="button" class="preview-card" data-nav="reminder" data-id="' + esc(nearest.anniversary.id) + '" data-preview="1">' +
          '<span class="preview-eyebrow">알림 미리보기</span>' +
          '<span class="preview-title">' + esc(A.anniversaryTitle(nearest.anniversary)) + ' · ' + esc(nearest.dday) + '</span>' +
          '<span class="preview-sub">D-' + nearest.anniversary.reminderDaysBefore +
          '에 도착할 알림 화면을 지금 열어 볼 수 있어요</span>' +
          '<span class="preview-arrow">' + ICONS.chevron + '</span>' +
          '</button>'
      );
    }

    out.push(sectionTitle('다가오는 기념일', upcoming.length > 0 ? upcoming.length + '개' : ''));

    if (upcoming.length === 0) {
      out.push(
        card(
          '<p class="empty-title">아직 등록한 기념일이 없어요</p>' +
            note('부모님 생신처럼 매년 챙기고 싶은 날부터 적어 두면, 일주일 전에 선물 후보와 미리 적은 말을 함께 알려 드려요.') +
            button('기념일 추가하기', 'data-nav="add"', 'secondary')
        )
      );
    } else {
      upcoming.forEach(function (item) {
        var a = item.anniversary;
        var foot;
        if (item.isSensitive) {
          foot = '<span class="row-foot row-foot--sensitive">조용히 기억하는 날</span>';
        } else if (item.hasSelectedGift) {
          foot = '<span class="row-foot">미리 골라 둔 선물 · ' + esc(a.selectedGiftTitle) + '</span>';
        } else {
          foot = '<span class="row-foot row-foot--muted">선물 아직 안 고름</span>';
        }
        out.push(
          '<div class="row-card" role="button" tabindex="0" data-nav="detail" data-id="' + esc(a.id) + '">' +
            '<div class="row-head">' +
            '<div class="row-title-wrap"><p class="row-title">' + esc(A.anniversaryTitle(a)) + '</p>' +
            '<p class="row-meta">' + esc(a.personName) + ' · ' + esc(A.RELATION_LABELS[a.relation]) + ' · ' +
            esc(A.OCCASION_LABELS[a.occasion]) + '</p></div>' +
            ddayBadge(item) +
            '</div>' +
            '<p class="row-date">' + esc(item.dateDescription) + '</p>' +
            foot +
            '</div>'
        );
      });
    }

    out.push(button('기념일 추가', 'data-nav="add"'));
    out.push(note('상대방 연락처는 저장하지 않아요. 이름과 관계만 적어 두면 돼요.'));
    return out.join('');
  }

  /* ------------------------------------------------------------------
   * 화면 ② 등록
   * ---------------------------------------------------------------- */

  function budgetOf(text) {
    return Number(String(text || '').replace(/[^0-9]/g, '')) || 0;
  }

  function datePreviewHtml(form, today) {
    var month = Number(form.month);
    var day = Number(form.day);
    if (!month || !day) return '<span class="preview-value">월·일을 고르면 자동으로 계산해 드려요.</span>';
    var rule = { month: month, day: day, isLunar: form.isLunar, isLeapMonth: form.isLeapMonth };
    var occ = A.nextOccurrence(rule, today);
    if (!occ) return '<span class="preview-value preview-value--warn">이 날짜는 계산할 수 없어요. 월·일을 확인해 주세요.</span>';
    return '<span class="preview-value">' + esc(A.describeOccurrence(rule, occ)) + '</span>';
  }

  function leapHintText(form, today) {
    if (!form.isLunar) return '';
    var month = Number(form.month);
    if (!month) return '음력 생신·제사는 켜 두면 매년 양력 날짜로 바꿔 알려 드려요.';
    var now = A.parseISODate(today);
    var lunarNow = A.solarToLunar({ year: now.year, month: now.month, day: now.day });
    if (!lunarNow) return '';
    return A.hasLeapMonth(lunarNow.year, month)
      ? lunarNow.year + '년에는 윤' + month + '월이 있어요. 윤달 기념일이면 함께 켜 주세요.'
      : lunarNow.year + '년에는 윤' + month + '월이 없어요. 윤달로 두면 평달로 계산돼요.';
  }

  function renderAddScreen(form, settings, today) {
    var monthOptions = [];
    for (var m = 1; m <= 12; m += 1) monthOptions.push(m);
    var dayOptions = [];
    for (var d = 1; d <= 31; d += 1) dayOptions.push(d);

    var relationOptions = Object.keys(A.RELATION_LABELS).map(function (key) {
      return { value: key, label: A.RELATION_LABELS[key] };
    });
    var occasionOptions = Object.keys(A.OCCASION_LABELS).map(function (key) {
      return { value: key, label: A.OCCASION_LABELS[key] };
    });
    var reminderOptions = [3, 7, 14, 30].map(function (v) {
      return { value: String(v), label: 'D-' + v };
    });

    var isSensitive = form.occasion === 'memorial';
    var out = [];

    out.push(
      card(
        fieldText({ id: 'f-name', label: '이름', value: form.personName, placeholder: '예: 엄마, 민준, 지수', hint: '전화번호·주소 같은 연락처는 받지 않아요.' }) +
          '<div class="field"><span class="field-label">관계</span>' + chips(relationOptions, form.relation, 'set-relation') + '</div>' +
          '<div class="field"><span class="field-label">기념일 종류</span>' + chips(occasionOptions, form.occasion, 'set-occasion') +
          (isSensitive ? note('기일·제사는 선물 후보 없이 미리 적은 말만 전하는 걸로 동작해요.', 'warn') : '') +
          '</div>' +
          fieldText({ id: 'f-title', label: '기념일 이름 (선택)', value: form.title, placeholder: '예: 엄마 생신', hint: "비워 두면 '이름 + 종류'로 보여 드려요." })
      )
    );

    out.push(
      card(
        sectionTitle('날짜') +
          '<div class="row-2">' +
          selectField('f-month', '월', form.month, monthOptions, '월') +
          selectField('f-day', '일', form.day, dayOptions, '일') +
          '</div>' +
          fieldSwitch('f-lunar', '음력 기념일', form.isLunar ? leapHintText(form, today) : '음력 생신·제사는 켜 두면 매년 양력 날짜로 바꿔 알려 드려요.', form.isLunar) +
          (form.isLunar ? fieldSwitch('f-leap', '윤달 기념일', '', form.isLeapMonth) : '') +
          '<div class="preview-box"><span class="preview-label">다음 기념일</span>' +
          '<span id="date-preview">' + datePreviewHtml(form, today) + '</span></div>'
      )
    );

    out.push(
      card(
        sectionTitle('기억해 둘 것') +
          fieldText({ id: 'f-taste', label: '취향 메모', value: form.tasteMemo, placeholder: '예: 허리가 아프시고 따뜻한 차를 좋아하심', multiline: true, rows: 2, hint: '선물 후보를 고를 때 이 메모를 써요.' }) +
          fieldText({ id: 'f-message', label: '하고 싶은 말 (미리 적기)', value: form.messageDraft, placeholder: '예: 올해도 건강하게 오래오래 계세요.', multiline: true, rows: 3, hint: '알림 화면의 문안으로 이어지고, 복사해서 카톡에 붙여 넣을 수 있어요.' }) +
          fieldText({ id: 'f-budget', label: '선물 예산 (원)', value: form.budgetText, placeholder: '50000', inputmode: 'numeric' }) +
          '<div class="field"><span class="field-label">알림 시점</span>' + chips(reminderOptions, form.reminderDays, 'set-reminder') + '</div>'
      )
    );

    if (!isSensitive) {
      var selected = form.selectedGift;
      out.push(
        card(
          sectionTitle('선물 미리 골라 두기') +
            (selected
              ? '<div class="selected-gift"><p class="gift-title">' + esc(selected.title) + '</p>' +
                (selected.url ? '<p class="hint">' + esc(selected.url) + '</p>' : note('링크 없이 이름만 저장돼요.')) +
                '</div>' +
                button('다시 고르기', 'data-action="open-picker" data-source="form"', 'secondary') +
                '<button type="button" class="link-btn link-btn--muted" data-action="clear-form-gift">선택 해제</button>'
              : note('지금 골라 두면 알림 화면 맨 위에 떠요. 나중에 골라도 돼요.') +
                button('선물 후보 보기', 'data-action="open-picker" data-source="form"', 'secondary'))
        )
      );
    }

    if (form.error) out.push('<p class="form-error" role="alert">' + esc(form.error) + '</p>');
    out.push(button('저장하기', 'data-action="save-anniversary"'));
    return out.join('');
  }

  /* ------------------------------------------------------------------
   * 화면 ② 상세
   * ---------------------------------------------------------------- */

  function renderDetailScreen(a, today, draft) {
    draft = draft || {
      id: a.id,
      messageDraft: a.messageDraft || '',
      tasteMemo: a.tasteMemo || '',
      historyTitle: '',
      historyPrice: '',
      historyDate: today
    };
    var rule = A.anniversaryRule(a);
    var occurrence = A.nextOccurrence(rule, today);
    var days = occurrence ? A.daysBetween(today, occurrence.solar) : null;
    var upcoming = A.upcomingOccurrences(rule, today, 3);
    var isSensitive = Boolean(a.isSensitive) || a.occasion === 'memorial';
    var selectedGift = A.getGiftById(a.selectedGiftId);
    var out = [];

    out.push(
      card(
        '<div class="row-head">' +
          '<p class="date-big">' + esc(occurrence ? A.formatKoreanDate(occurrence.solar) : '날짜 확인 필요') + '</p>' +
          (days === null ? '' : '<span class="dday dday--' + (days <= 7 ? 'soon' : 'default') + '">D-' + Math.max(0, days) + '</span>') +
          '</div>' +
          note(occurrence ? A.describeOccurrence(rule, occurrence) : '날짜를 계산할 수 없어요.') +
          (upcoming.length > 1
            ? note('다음: ' + upcoming.slice(1).map(function (o) { return A.formatKoreanDate(o.solar); }).join(' · '))
            : '') +
          button('알림 화면 보기', 'data-nav="reminder" data-id="' + esc(a.id) + '"'),
        isSensitive ? 'sensitive' : 'tint'
      )
    );

    if (isSensitive) {
      out.push(
        card(
          sectionTitle('조용히 기억하는 날') +
            note('기일·제사처럼 마음을 조용히 전하는 자리라 선물 후보를 보여 드리지 않아요. 미리 적어 둔 말만 알림에서 보여 드려요.')
        )
      );
    } else {
      var giftBlock;
      if (a.selectedGiftTitle) {
        giftBlock =
          '<article class="gift-card gift-card--primary">' +
          '<div class="gift-head"><span class="badge">미리 골라 둔 선물</span>' +
          affiliateTag(Boolean(selectedGift && selectedGift.isAffiliate)) + '</div>' +
          '<p class="gift-title gift-title--lg">' + esc(a.selectedGiftTitle) + '</p>' +
          (selectedGift ? '<p class="gift-price">' + esc(A.formatWon(selectedGift.priceWon)) + '</p>' : '') +
          note('이 기념일은 이 선물로 미리 정해 두었어요. 알림 화면에서 맨 위에 보여 드려요.') +
          (a.selectedGiftUrl
            ? '<button type="button" class="btn" data-action="open-link" data-id="' + esc(a.id) + '">선물하기 열기</button>'
            : note('저장된 링크가 없어요. 선물을 다시 골라 주세요.', 'warn')) +
          '<div class="link-row"><button type="button" class="link-btn" data-action="open-picker" data-source="detail">다른 선물로 바꾸기</button>' +
          '<button type="button" class="link-btn link-btn--muted" data-action="clear-gift" data-id="' + esc(a.id) + '">지우기</button></div>' +
          '</article>';
      } else {
        giftBlock =
          note('아직 골라 두지 않았어요. 알림 화면에서는 매번 후보 3개를 새로 보여 드려요.') +
          button('선물 후보 보기', 'data-action="open-picker" data-source="detail"', 'secondary');
      }
      out.push(card(sectionTitle('선물 미리 골라 두기') + giftBlock));
    }

    out.push(
      card(
        sectionTitle('하고 싶은 말') +
          '<div class="field"><label class="field-label" for="d-message">미리 적어 둔 말</label>' +
          '<textarea id="d-message" class="input input--area" rows="3" placeholder="그날 전하고 싶은 말을 지금 적어 두세요.">' +
          esc(draft.messageDraft) + '</textarea></div>' +
          '<div class="message" id="d-message-preview">' +
          esc(A.buildMessageText({ personName: a.personName, relation: a.relation, occasion: a.occasion, title: a.title, messageDraft: draft.messageDraft, isSensitive: a.isSensitive })) +
          '</div>' +
          button('저장', 'data-action="save-message" data-id="' + esc(a.id) + '"') +
          button('문안 복사', 'data-action="copy-message" data-id="' + esc(a.id) + '" data-draft="1"', 'secondary')
      )
    );

    out.push(
      card(
        sectionTitle('취향 메모') +
          '<div class="field"><label class="field-label" for="d-taste">취향 · 상황 메모</label>' +
          '<textarea id="d-taste" class="input input--area" rows="2" placeholder="예: 허리가 아프심, 커피는 산미 없는 걸 좋아함">' +
          esc(draft.tasteMemo) + '</textarea>' +
          '<p class="hint">선물 후보 매칭과 추천 이유에 쓰여요.</p></div>' +
          button('메모 저장', 'data-action="save-taste" data-id="' + esc(a.id) + '"', 'secondary')
      )
    );

    var history = a.giftHistory || [];
    out.push(
      card(
        sectionTitle('지난 선물 기록', history.length > 0 ? history.length + '건' : '') +
          (history.length === 0
            ? note('작년에 뭘 줬는지 적어 두면 같은 선물을 다시 추천하지 않아요.')
            : '<div class="history-list">' +
              history
                .map(function (entry) {
                  return (
                    '<div class="history-row"><div class="history-text">' +
                    '<p class="history-title">' + esc(entry.giftTitle) + '</p>' +
                    '<p class="row-meta">' + esc(entry.givenOn) +
                    (entry.priceWon ? ' · ' + esc(A.formatWon(entry.priceWon)) : '') + '</p></div>' +
                    '<button type="button" class="link-btn link-btn--muted" data-action="remove-history" data-id="' +
                    esc(a.id) + '" data-entry="' + esc(entry.id) + '">삭제</button></div>'
                  );
                })
                .join('') +
              '</div>') +

  function renderReminderScreen(a, today, options) {
    var plan = A.buildReminder(a, today);
    var opts = options || {};
    var rule = A.anniversaryRule(a);
    var ruleParts = [A.ruleLabel(rule)];
    if (plan.occurrence && plan.occurrence.leapMonthFallback) ruleParts.push('윤달이 없어 평달로');
    if (plan.occurrence && plan.occurrence.dayAdjusted) {
      ruleParts.push(plan.occurrence.requestedDay + '일이 없어 ' + plan.occurrence.actualDay + '일로');
    }
    var out = [];

    out.push(
      '<div class="hero' + (plan.isSensitive ? ' hero--sensitive' : '') + '">' +
        '<div class="row-head"><span class="hero-dday">' + esc(plan.dday) + '</span>' +
        '<span class="hero-date">' + esc(plan.dateText) + '</span></div>' +
        '<p class="hero-desc">' + esc(ruleParts.join(' · ')) + '</p>' +
        (plan.isDue
          ? '<span class="status-chip">' + ICONS.check + ' 지금 알림이 나가는 시점이에요</span>'
          : '<span class="status-chip status-chip--muted">알림은 D-' + a.reminderDaysBefore + '에 와요</span>') +
        (opts.preview ? '<p class="note">미리보기예요. 실제 알림은 D-' + a.reminderDaysBefore + '에 도착해요.</p>' : '') +
        '</div>'
    );

    if (plan.notice && plan.isSensitive) out.push(note(plan.notice));

    if (plan.isSensitive) {
      out.push(
        card(
          sectionTitle('전할 말') +
            messageBlock(plan.messageText) +
            button('메시지 복사하기', 'data-action="copy-message" data-id="' + esc(a.id) + '"')
        )
      );
    } else {
      out.push(sectionTitle('1순위 · 미리 골라 둔 선물'));

      if (plan.selectedGift) {
        out.push(
          '<article class="gift-card gift-card--primary">' +
            '<div class="gift-head"><span class="badge">미리 골라 둔 선물</span>' + affiliateTag(plan.selectedGift.isAffiliate) + '</div>' +
            '<p class="gift-title gift-title--lg">' + esc(plan.selectedGift.title) + '</p>' +
            (plan.selectedGift.priceWon !== undefined ? '<p class="gift-price">' + esc(A.formatWon(plan.selectedGift.priceWon)) + '</p>' : '') +
            '<p class="reason">' + esc(plan.selectedGift.reason) + '</p>' +
            '<button type="button" class="btn" data-action="open-link" data-id="' + esc(a.id) + '">고른 선물 바로 보내기</button>' +
            (messageDraftOf(a) ? '<p class="hint">' + esc(GIFT_COPY_HINT) + '</p>' : '') +
            button('메시지 복사하기', 'data-action="copy-message" data-id="' + esc(a.id) + '"', 'secondary') +
            '<div class="link-row"><button type="button" class="link-btn" data-action="open-picker" data-source="reminder">다른 선물로 바꾸기</button>' +
            '<button type="button" class="link-btn link-btn--muted" data-action="clear-gift" data-id="' + esc(a.id) + '">선택 해제</button></div>' +
            '<p class="hint">' + esc(A.AFFILIATE_DISCLOSURE) + '</p>' +
            '</article>'
        );
      } else {
        out.push(
          card(
            note('아직 미리 골라 둔 선물이 없어요. 아래 후보에서 하나 골라 두면 알림 때 바로 열 수 있어요.') +
              button('선물 후보 보기', 'data-action="open-picker" data-source="reminder"', 'secondary')
          )
        );
      }

      out.push(sectionTitle('대체 추천', plan.alternatives.length + '개'));
      if (plan.alternatives.length === 0) {
        out.push(card(note('대체 후보가 없어요. 예산이나 취향 메모를 조금 바꿔 보세요.')));
      } else {
        plan.alternatives.forEach(function (rec) {
          out.push(
            giftCardHtml(
              rec,
              'data-action="open-link" data-id="' + esc(a.id) + '" data-gift-id="' + esc(rec.gift.id) + '"',
              '이 선물 열기'
            )
          );
        });
      }

      out.push(
        card(
          sectionTitle('미리 적어 둔 말') +
            messageBlock(plan.messageText) +
            button('메시지 복사하기', 'data-action="copy-message" data-id="' + esc(a.id) + '"') +
            button('기념일 상세 열기', 'data-nav="detail" data-id="' + esc(a.id) + '"', 'secondary')
        )
      );
    }

    out.push(
      card(
        sectionTitle('카카오톡으로 받아보기') +
          note('D-7 안내와 고른 선물을 내 카톡으로 받아볼 수 있어요. 다른 사람에게 자동으로 보내지 않아요.') +
          button('카톡 나에게 보내기', 'data-action="send-kakao" data-id="' + esc(a.id) + '"', 'secondary'),
        'mild'
      )
    );

    if (!plan.isSensitive) {
      out.push(note(A.MANUAL_PAYMENT_NOTICE));
      if (!plan.selectedGift) out.push(note(A.AFFILIATE_DISCLOSURE));
    }
    return out.join('');
  }

  /* ------------------------------------------------------------------
   * 앱 상태 · 라우팅 · 이벤트
   * ---------------------------------------------------------------- */

  var store = null;
  var route = { name: 'home', id: null, preview: false };
  var today = A.todayISO();
  var form = null;
  var detail = null;
  var settingsBudgetText = null;
  var modal = null;
  var toastTimer = null;

  function newForm(settings) {
    return {
      personName: '',
      title: '',
      relation: 'parent',
      occasion: 'birthday',
      month: '',
      day: '',
      isLunar: false,
      isLeapMonth: false,
      budgetText: String(settings.defaultBudget),
      reminderDays: String(settings.defaultReminderDaysBefore),
      tasteMemo: '',
      messageDraft: '',
      selectedGift: null,
      error: ''
    };
  }

  function currentAnniversary() {
    if (!store || !route.id) return undefined;
    return store.getAnniversary(route.id);
  }

  function ensureDetail(a) {
    if (!a) {
      detail = null;
      return;
    }
    if (!detail || detail.id !== a.id) {
      detail = {
        id: a.id,
        messageDraft: a.messageDraft || '',
        tasteMemo: a.tasteMemo || '',
        budgetText: String(a.budget === undefined ? '' : a.budget),
        historyTitle: '',
        historyPrice: '',
        historyDate: today
      };
    }
  }

  function parseHash() {
    var raw = String((typeof location !== 'undefined' && location.hash) || '').replace(/^#\/?/, '');
    var query = '';
    var qIndex = raw.indexOf('?');
    if (qIndex >= 0) {
      query = raw.slice(qIndex + 1);
      raw = raw.slice(0, qIndex);
    }
    var parts = raw.split('/');
    var name = parts[0] || 'home';
    if (['home', 'add', 'settings', 'detail', 'reminder'].indexOf(name) === -1) name = 'home';
    return { name: name, id: parts[1] || null, preview: /preview=1/.test(query) };
  }

  function hashFor(name, id, preview) {
    if (name === 'detail' || name === 'reminder') return '#/' + name + '/' + id + (preview ? '?preview=1' : '');
    return '#/' + name;
  }

  function go(name, id, preview) {
    var target = hashFor(name, id, preview);
    if (String(location.hash) === target) {
      applyRoute();
      render(true);
      return;
    }
    location.hash = target;
  }

  function applyRoute() {
    route = parseHash();
    if (route.name === 'detail' || route.name === 'reminder') {
      ensureDetail(currentAnniversary());
    }
  }

  function renderTopBar() {
    var data = store.getState();
    var back = route.name !== 'home' && route.name !== 'add' && route.name !== 'settings';
    var title = '기념일 챙김';
    var subtitle = '오늘은 ' + A.formatKoreanDate(today) + '이에요.';

    if (route.name === 'add') {
      title = '기념일 등록';
      subtitle = '이름·관계·날짜만 있으면 돼요. 연락처는 받지 않아요.';
    } else if (route.name === 'detail') {
      var a = currentAnniversary();
      title = a ? A.anniversaryTitle(a) : '기념일을 찾을 수 없어요';
      subtitle = a ? a.personName + ' · ' + A.RELATION_LABELS[a.relation] + ' · ' + A.OCCASION_LABELS[a.occasion] : '';
    } else if (route.name === 'reminder') {
      var r = currentAnniversary();
      title = r ? A.anniversaryTitle(r) : '알림';
      subtitle = r ? r.personName + ' · ' + A.formatKoreanDate(today) + ' 기준' : '';
    } else if (route.name === 'settings') {
      title = '설정';
      subtitle = '알림 시점과 기본 예산을 정해 두면 등록할 때 자동으로 채워져요.';
    }

    var right = '';
    if (route.name === 'home') {
      right = '<button type="button" class="topbar-link" data-nav="settings">설정</button>';
    }

    return (
      (back
        ? '<button type="button" class="icon-btn" data-action="back" aria-label="뒤로">' + ICONS.back + '</button>'
        : '') +
      '<div class="topbar-title"><h1>' + esc(title) + '</h1>' +
      (subtitle ? '<p>' + esc(subtitle) + '</p>' : '') + '</div>' + right
    );
  }

  function renderTabBar() {
    var tab = route.name === 'add' ? 'add' : route.name === 'settings' ? 'settings' : 'home';
    var items = [
      { key: 'home', label: '홈', icon: ICONS.home, nav: 'home' },
      { key: 'add', label: '추가', icon: ICONS.plus, nav: 'add' },
      { key: 'settings', label: '설정', icon: ICONS.sliders, nav: 'settings' }
    ];
    return items
      .map(function (item) {
        return (
          '<button type="button" class="tab" data-nav="' + item.nav + '"' +
          (tab === item.key ? ' aria-current="page"' : '') + '>' +
          item.icon + '<span>' + item.label + '</span></button>'
        );
      })
      .join('');
  }

  function renderCurrentScreen() {
    var data = store.getState();
    if (route.name === 'home') return renderHomeScreen(data, today);
    if (route.name === 'add') {
      if (!form) form = newForm(data.settings);
      return renderAddScreen(form, data.settings, today);
    }
    if (route.name === 'settings') return renderSettingsScreen(data, { storageKind: store.storageKind, budgetText: settingsBudgetText });
    var a = currentAnniversary();
    if (!a) {
      return card('<p class="empty-title">기념일을 찾을 수 없어요</p>' + note('목록에서 다시 열어 주세요.') +
        button('홈으로', 'data-nav="home"', 'secondary'));
    }
    if (route.name === 'detail') {
      ensureDetail(a);
      return renderDetailScreen(a, today, detail);
    }
    return renderReminderScreen(a, today, { preview: route.preview });
  }

  function renderModal() {
    if (!modal) return '<div class="modal-layer" hidden></div>';
    var body = '';
    var title = '';
    var foot = '';

    if (modal.type === 'gift-picker') {
      var a = modal.source === 'form' ? null : store.getAnniversary(modal.id);
      var relation = modal.source === 'form' ? form.relation : a.relation;
      var budget = modal.source === 'form' ? budgetOf(form.budgetText) || store.getState().settings.defaultBudget : a.budget;
      var occasion = modal.source === 'form' ? form.occasion : a.occasion;
      var tasteMemo = modal.source === 'form' ? form.tasteMemo : a.tasteMemo;
      var isSensitive = modal.source === 'form' ? form.occasion === 'memorial' : Boolean(a.isSensitive) || a.occasion === 'memorial';
      var result = A.matchGifts({ relation: relation, budget: budget, occasion: occasion, tasteMemo: tasteMemo, isSensitive: isSensitive, limit: 5 });
      var selectedId = modal.source === 'form' ? (form.selectedGift && form.selectedGift.id) : a.selectedGiftId;

      title = '선물 미리 고르기';
      body =
        note(
          result.sensitive
            ? '이 기념일은 마음을 조용히 전하는 자리라 선물 후보를 보여 드리지 않아요.'
            : '관계·예산·취향 메모로 고른 후보예요. 지금 골라 두면 알림 화면 맨 위에 떠요.'
        ) +
        result.recommendations
          .map(function (rec) {
            var isCurrent = selectedId === rec.gift.id;
            return (
              '<article class="gift-card">' +
              '<div class="gift-head"><h3 class="gift-title">' + esc(rec.gift.title) + '</h3>' +
              '<span class="gift-price">' + esc(A.formatWon(rec.gift.priceWon)) + '</span></div>' +
              '<p class="gift-desc">' + esc(rec.gift.description) + '</p>' +
              '<p class="reason">' + esc(rec.reason) + '</p>' +
              '<div class="tag-row">' + affiliateTag(rec.gift.isAffiliate) +
              rec.gift.tasteTags.slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
              '</div>' +
              '<button type="button" class="btn btn--secondary" data-action="pick-gift" data-source="' + esc(modal.source) +
              '" data-id="' + esc(modal.id || '') + '" data-gift-id="' + esc(rec.gift.id) + '">' +
              (isCurrent ? '지금 고른 선물이에요' : '이 선물 고르기') + '</button>' +
              '</article>'

          })
          .join('') +
        (result.notice && !result.sensitive ? note(result.notice) : '');

      if (!result.sensitive) {
        body +=
          '<div class="manual-box"><p class="manual-title">목록에 없으면 직접 정할 수 있어요</p>' +
          '<input id="m-title" class="input" type="text" placeholder="선물 이름 (예: 동네 꽃집 계절 꽃다발)">' +
          '<input id="m-url" class="input" type="url" inputmode="url" placeholder="링크 (https://...)">' +
          '<button type="button" class="btn btn--secondary" data-action="manual-gift" data-source="' + esc(modal.source) +
          '" data-id="' + esc(modal.id || '') + '">이 선물로 정하기</button></div>';
      }
    } else if (modal.type === 'kakao') {
      var plan = A.buildReminder(store.getAnniversary(modal.id), today);
      var payload = A.buildKakaoMemoPayload(plan);
      title = '카톡 나에게 보내기 (미리보기)';
      body =
        '<div class="kakao"><p class="kakao-title">' + esc(payload.title) + '</p>' +
        '<p class="kakao-body">' + esc(payload.body) + '</p></div>' +
        note('카카오 연동 전이라 실제로 보내지지는 않아요. 보낼 내용만 미리 보여 드려요.', 'warn') +
        note('연동하려면 카카오 developers 앱 등록 + 로그인 동의(talk_message)와 토큰 교환 서버가 필요해요. 설정 → 연동 방법 보기에서 확인할 수 있어요.') +
        button('보낼 내용 복사', 'data-action="copy-kakao"', 'secondary');
    } else if (modal.type === 'link') {
      var giftA = store.getAnniversary(modal.id);
      var gift = modal.giftId ? A.getGiftById(modal.giftId) : null;
      /* 저장된 주소가 예전 자리표시자여도 카탈로그의 실제 링크를 우선한다. */

          ? '<p class="link-alt">새 창이 안 열리면 <a href="' + esc(url) + '" rel="noopener noreferrer" data-copy-on-open="1">같은 창에서 열기</a></p>'

    } else if (modal.type === 'confirm') {

      body =

        note('브라우저가 자동 복사를 막았어요. 아래 글을 길게 눌러 직접 복사해 주세요.') +
        '<textarea class="input input--area" rows="8" readonly>' + esc(modal.text) + '</textarea>' +
        '<button type="button" class="btn btn--secondary" data-action="close-modal">닫기</button>';
    }

    return (
      '<div class="modal-layer">' +
