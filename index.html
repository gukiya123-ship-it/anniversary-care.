  function render(resetScroll) {
    var screen = document.getElementById('screen');
    var scroll = screen ? screen.scrollTop : 0;
    if (modal) hideToast();
    document.getElementById('topbar').innerHTML = renderTopBar();
    if (screen) {
      screen.innerHTML = renderCurrentScreen();
      screen.scrollTop = resetScroll ? 0 : scroll;
    }
    document.getElementById('tabbar').innerHTML = renderTabBar();
    document.getElementById('tabbar').hidden = route.name === 'detail' || route.name === 'reminder';
    document.getElementById('modal-root').innerHTML = renderModal();
  }

  function showToast(message) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
    }, 2400);
  }

  function hideToast() {
    var el = document.getElementById('toast');
    if (el) el.classList.remove('show');
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
  }

  /* ---- 복사 ---- */

  function fallbackCopy(text) {
    var ok = false;
    try {
      var el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', 'readonly');
      el.style.position = 'fixed';
      el.style.top = '-1000px';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.select();
      el.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      document.body.removeChild(el);
    } catch (error) {
      ok = false;
    }
    return ok;
  }

  function copyText(text, done) {
    var finish = function (ok) {
      if (ok) {
        if (done) done();
        showToast('복사했어요. 카톡에 붙여 넣어 보내세요.');
      } else {
        modal = { type: 'copy', text: text };
        render();
      }
    };
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        finish(true);
      }, function () {
        finish(fallbackCopy(text));
      });
      return;
    }
    finish(fallbackCopy(text));
  }

  /* ---- 선물 링크로 넘어갈 때 미리 적어 둔 말을 같이 복사 ---- */

  var GIFT_COPY_TOAST = '메시지를 복사했어요! 선물하기 화면에서 붙여넣기만 하세요.';
  var GIFT_COPY_HINT = '이 버튼을 누르면 미리 적어 둔 말이 클립보드에 같이 복사돼요.';

  function messageDraftOf(a) {
    return a && typeof a.messageDraft === 'string' ? trim(a.messageDraft) : '';
  }

  /**
   * 선물하기로 넘어가기 직전에 미리 적어 둔 말을 클립보드에 넣어 둔다.
   * 결과는 'copied' | 'failed' | 'none' (아직 복사 중이면 'pending') 으로 알려 준다.
   * 복사가 막혀도 복사 폴백 모달을 열지 않는다 — 선물 링크를 여는 흐름을 가로막지 않으려고,
   * 대신 부르는 쪽이 안내 문구로 알려 준다.
   */
  function copyMessageForGift(a, onResult, options) {
    var opts = options || {};
    var done = function (state) {
      if (typeof onResult === 'function') onResult(state);
      return state;
    };
    if (!messageDraftOf(a)) return done('none');

    var text = A.buildMessageText(a);
    var settle = function (ok) {
      if (ok) showToast(GIFT_COPY_TOAST);
      return done(ok ? 'copied' : 'failed');
    };

    /* '같은 창에서 열기'처럼 곧 페이지를 떠나는 경우엔 동기 복사가 더 확실하다. */
    if (opts.sync) return settle(fallbackCopy(text));

    var clipboard = typeof navigator !== 'undefined' ? navigator.clipboard : null;
    if (!clipboard || !clipboard.writeText) return settle(fallbackCopy(text));
    try {
      var pending = clipboard.writeText(text);
      if (pending && typeof pending.then === 'function') {
        pending.then(
          function () {
            settle(true);
          },
          function () {
            settle(fallbackCopy(text));
          }
        );
        return 'pending';
      }
      return settle(true);
    } catch (error) {
      return settle(fallbackCopy(text));
    }
  }

  /** 선물 링크 모달 안의 자동 복사 안내 */
  function linkCopyNoteInner(state) {
    if (state === 'copied') {
      return '<p class="note note--accent">' + ICONS.check + ' ' + esc(GIFT_COPY_TOAST) + '</p>';
    }
    if (state === 'failed') {
      return note('메시지를 자동으로 복사하지 못했어요. 선물하기를 연 뒤 이 화면으로 돌아와 ‘메시지 복사하기’를 눌러 주세요.', 'warn');
    }
    if (state === 'none') {
      return note('아직 미리 적어 둔 말이 없어 복사할 문안이 없어요. 기념일 상세에서 적어 두면 다음부터 선물할 때 같이 복사돼요.');
    }
    return note('미리 적어 둔 말을 클립보드에 복사하고 있어요…');
  }

  function openExternal(url) {
    if (!url) {
      showToast('열 링크가 없어요.');
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('새 창에서 링크를 열었어요.');
    } catch (error) {
      modal = { type: 'copy', text: url };
      render();
    }
  }

  /* ---- 동작 ---- */

  function messageTextFor(a, draftOverride) {
    if (!a) return '';
    var base = { personName: a.personName, relation: a.relation, occasion: a.occasion, title: a.title, isSensitive: a.isSensitive };
    base.messageDraft = draftOverride === undefined ? a.messageDraft : draftOverride;
    return A.buildMessageText(base);
  }

  function handleSaveAnniversary() {
    var budget = budgetOf(form.budgetText);
    var month = Number(form.month);
    var day = Number(form.day);
    form.error = '';

    if (!trim(form.personName)) {
      form.error = '이름이 필요해요. 어떤 분의 기념일인지 이름을 적어 주세요.';
    } else if (!month || month < 1 || month > 12) {
      form.error = '월을 골라 주세요.';
    } else if (!day || day < 1) {
      form.error = '일을 골라 주세요.';
    } else if (form.isLunar && day > 30) {
      form.error = '음력은 30일까지 있어요.';
    } else if (!form.isLunar && day > A.daysInMonth(A.parseISODate(today).year, month) && !(month === 2 && day === 29)) {
      form.error = month + '월은 ' + A.daysInMonth(A.parseISODate(today).year, month) + '일까지 있어요.';
    }

    if (form.error) {
      render();
      var err = document.querySelector('.form-error');
      if (err && err.scrollIntoView) err.scrollIntoView({ block: 'center' });
      return;
    }

    try {
      var created = store.addAnniversary({
        personName: form.personName,
        relation: form.relation,
        occasion: form.occasion,
        title: form.title,
        month: month,
        day: day,
        isLunar: form.isLunar,
        isLeapMonth: form.isLunar && form.isLeapMonth,
        messageDraft: form.messageDraft,
        tasteMemo: form.tasteMemo,
        budget: budget,
        reminderDaysBefore: Number(form.reminderDays),
        selectedGiftId: form.selectedGift ? form.selectedGift.id : undefined,
        selectedGiftTitle: form.selectedGift ? form.selectedGift.title : undefined,
        selectedGiftUrl: form.selectedGift ? form.selectedGift.url : undefined
      });
      form = newForm(store.getState().settings);
      detail = null;
      showToast('기념일을 저장했어요.');
      go('detail', created.id);
    } catch (error) {
      form.error = error && error.message ? error.message : '저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
      render();
    }
  }

  function pickGift(gift) {
    if (modal.source === 'form') {
      form.selectedGift = gift;
    } else {
      store.selectGift(modal.id, gift);
    }
    modal = null;
    render();
    showToast('선물을 골라 두었어요.');
  }

  function openPicker(source) {
    modal = { type: 'gift-picker', source: source, id: route.id };
    render();
  }

  function openLinkModal(anniversaryId, giftId) {
    modal = { type: 'link', id: anniversaryId, giftId: giftId || null, copyState: 'pending' };
    copyMessageForGift(store.getAnniversary(anniversaryId), function (state) {
      if (!modal || modal.type !== 'link' || modal.id !== anniversaryId) return;
      modal.copyState = state;
      var holder = document.getElementById('link-copy-note');
      if (holder) holder.innerHTML = linkCopyNoteInner(state);
    });
    render();
  }

  function handleAction(action, el) {
    var id = el.getAttribute('data-id');
    var value = el.getAttribute('data-value');
    var source = el.getAttribute('data-source');
    var a;

    switch (action) {
      case 'back':
        if (history.length > 1) history.back();
        else go('home');
        return;
      case 'set-relation':
        form.relation = value;
        render();
        return;
      case 'set-occasion':
        form.occasion = value;
        if (form.occasion === 'memorial') form.selectedGift = null;
        render();
        return;
      case 'set-reminder':
        form.reminderDays = value;
        render();
        return;
      case 'set-default-reminder':
        store.updateSettings({ defaultReminderDaysBefore: Number(value) });
        render();
        showToast('기본 알림 시점을 D-' + value + '로 두었어요.');
        return;
      case 'save-budget':
        var budgetInput = document.getElementById('s-budget');
        var budgetValue = budgetOf(budgetInput ? budgetInput.value : '');
        settingsBudgetText = String(budgetValue);
        store.updateSettings({ defaultBudget: budgetValue });
        render();
        showToast('기본 예산을 ' + A.formatWon(budgetValue) + '으로 두었어요.');
        return;
      case 'toggle-kakao':
        store.updateSettings({ kakaoMemoLinked: !store.getState().settings.kakaoMemoLinked });
        render();
        return;
      case 'show-kakao-help':
        modal = { type: 'info', title: '카카오 연동 준비', body: A.KAKAO_MEMO_SETUP_NOTE };
        render();
        return;
      case 'show-privacy':
        modal = {
          type: 'info',
          title: '개인정보처리방침',
          body:
            'MVP 공개 전에 정식 문서로 작성해 링크할 자리예요.\n\n지금 이 웹앱이 지키는 원칙\n· 상대방 연락처(전화번호·이메일·주소) 미수집\n· 이름·관계·날짜만 이 기기에 저장\n· 서버로 아무것도 보내지 않음 (인터넷 없이 동작)\n· 데이터는 설정에서 언제든 초기화'
        };
        render();
        return;
      case 'show-account':
        modal = {
          type: 'info',
          title: '계정 삭제',
          body:
            '지금은 로그인·계정이 없는 웹앱이라 계정 삭제 자리만 있어요. 설정 → 모든 기념일 지우기로 이 기기의 데이터를 바로 지울 수 있어요.'
        };
        render();
        return;
      case 'reset-all':
        modal = {
          type: 'confirm',
          title: '예시 데이터로 되돌릴까요?',
          body: '이 기기에 저장한 기념일이 예시 4건으로 바뀌어요.',
          confirmLabel: '되돌리기',
          next: function () {
            store.resetAll();
            form = newForm(store.getState().settings);
            showToast('예시 데이터로 되돌렸어요.');
          }
        };
        render();
        return;
      case 'clear-all':
        modal = {
          type: 'confirm',
          title: '모든 기념일을 지울까요?',
          body: '적어 둔 말과 선물 기록도 함께 지워져요.',
          confirmLabel: '모두 지우기',
          danger: true,
          next: function () {
            store.clearAll();
            form = newForm(store.getState().settings);
            showToast('모든 기념일을 지웠어요.');
          }
        };
        render();
        return;
      case 'save-anniversary':
        handleSaveAnniversary();
        return;
      case 'delete-anniversary':
        a = store.getAnniversary(id);
        modal = {
          type: 'confirm',
          title: '기념일을 지울까요?',
          body: (a ? A.anniversaryTitle(a) + ' (' + a.personName + ')\n' : '') + '적어 둔 말과 선물 기록도 함께 사라져요.',
          confirmLabel: '지우기',
          danger: true,
          next: function () {
            store.removeAnniversary(id);
            detail = null;
            showToast('기념일을 지웠어요.');
            go('home');
          }
        };
        render();
        return;
      case 'save-detail-budget':
        var budgetEl = document.getElementById('d-budget');
        var nextBudget = budgetOf(budgetEl ? budgetEl.value : '');
        store.updateAnniversary(id, { budget: nextBudget });
        if (detail) detail.budgetText = String(nextBudget);
        render();
        showToast('예산을 ' + A.formatWon(nextBudget) + '으로 두었어요.');
        return;
      case 'set-detail-reminder':
        store.updateAnniversary(id, { reminderDaysBefore: Number(value) });
        render();
        showToast('알림 시점을 D-' + value + '로 두었어요.');
        return;
      case 'save-message':
        store.updateAnniversary(id, { messageDraft: trim(detail.messageDraft) });
        showToast('하고 싶은 말을 저장했어요.');
        render();
        return;
      case 'save-taste':
        store.updateAnniversary(id, { tasteMemo: trim(detail.tasteMemo) });
        showToast('취향 메모를 저장했어요.');
        render();
        return;
      case 'add-history':
        a = store.getAnniversary(id);
        if (!detail) return;
        if (!trim(detail.historyTitle)) {
          showToast('선물 이름을 적어 주세요.');
          return;
        }
        if (!A.isValidISODate(trim(detail.historyDate))) {
          showToast('준 날은 2026-11-14 형식으로 적어 주세요.');
          return;
        }
        store.addGiftHistory(id, {
          giftTitle: trim(detail.historyTitle),
          priceWon: budgetOf(detail.historyPrice) || undefined,
          givenOn: trim(detail.historyDate)
        });
        detail.historyTitle = '';
        detail.historyPrice = '';
        detail.historyDate = today;
        render();
        showToast('지난 선물을 기록했어요.');
        return;
      case 'remove-history':
        store.removeGiftHistory(id, el.getAttribute('data-entry'));
        render();
        return;
      case 'open-picker':
        openPicker(source || 'detail');
        return;
      case 'pick-gift':
        var picked = A.getGiftById(el.getAttribute('data-gift-id'));
        if (!picked) return;
        pickGift({ id: picked.id, title: picked.title, url: picked.url });
        return;
      case 'manual-gift':
        var titleInput = document.getElementById('m-title');
        var urlInput = document.getElementById('m-url');
        var manualTitle = trim(titleInput ? titleInput.value : '');
        var manualUrl = trim(urlInput ? urlInput.value : '');
        if (!manualTitle) {
          showToast('선물 이름을 적어 주세요.');
          return;
        }
        pickGift({ title: manualTitle, url: manualUrl || undefined });
        return;
      case 'clear-form-gift':
        form.selectedGift = null;
        render();
        return;
      case 'clear-gift':
        store.selectGift(id, null);
        render();
        showToast('고른 선물을 해제했어요.');
        return;
      case 'open-link':
        openLinkModal(id, el.getAttribute('data-gift-id'));
        return;
      case 'open-external':
        /* 링크를 여는 순간 미리 적어 둔 말을 다시 한 번 복사해 둔다(그 사이 클립보드가 바뀌었을 수 있어서). */
        var extA = modal && modal.id ? store.getAnniversary(modal.id) : null;
        openExternal(el.getAttribute('data-url'));
        if (extA) copyMessageForGift(extA);
        return;
      case 'copy-message':
        a = store.getAnniversary(id);
        if (!a) return;
        copyText(el.getAttribute('data-draft') === '1' && detail ? messageTextFor(a, detail.messageDraft) : A.buildMessageText(a));
        return;
      case 'send-kakao':
        modal = { type: 'kakao', id: id };
        render();
        return;
      case 'copy-kakao':
        var plan = A.buildReminder(store.getAnniversary(modal.id), today);
        var payload = A.buildKakaoMemoPayload(plan);
        copyText('[' + payload.title + ']\n' + payload.body);
        return;
      case 'close-modal':
        modal = null;
        render();
        return;
      case 'confirm-yes':
        var next = modal && modal.next;
        modal = null;
        if (next) next();
        render();
        return;
      default:
        return;
    }
  }

  function handleNav(el) {
    var target = el.getAttribute('data-nav');
    var id = el.getAttribute('data-id');
    var preview = el.getAttribute('data-preview') === '1';
    if (target === 'detail' || target === 'reminder') {
      go(target, id, preview);
      return;
    }
    if (target === 'add') {
      if (!form) form = newForm(store.getState().settings);
      go('add');
      return;
    }
    go(target);
  }

  function onInput(event) {
    var el = event.target;
    if (!el || !el.id) return;
    switch (el.id) {
      case 'f-name':
        form.personName = el.value;
        break;
      case 'f-title':
        form.title = el.value;
        break;
      case 'f-budget':
        form.budgetText = el.value;
        break;
      case 'f-taste':
        form.tasteMemo = el.value;
        break;
      case 'f-message':
        form.messageDraft = el.value;
        break;
      case 'd-message':
        if (!detail) return;
        detail.messageDraft = el.value;
        var preview = document.getElementById('d-message-preview');
        if (preview) {
          var a = currentAnniversary();
          preview.textContent = a ? messageTextFor(a, detail.messageDraft) : '';
        }
        break;
      case 'd-taste':
        if (detail) detail.tasteMemo = el.value;
        break;
      case 'h-title':
        if (detail) detail.historyTitle = el.value;
        break;
      case 'h-price':
        if (detail) detail.historyPrice = el.value;
        break;
      case 'h-date':
        if (detail) detail.historyDate = el.value;
        break;
      case 'd-budget':
        if (detail) detail.budgetText = el.value;
        break;
      case 's-budget':
        settingsBudgetText = el.value;
        break;
      default:
        break;
    }
  }

  function onChange(event) {
    var el = event.target;
    if (!el || !el.id) return;
    switch (el.id) {
      case 'f-month':
        form.month = el.value ? Number(el.value) : '';
        refreshDatePreview();
        break;
      case 'f-day':
        form.day = el.value ? Number(el.value) : '';
        refreshDatePreview();
        break;
      case 'f-lunar':
        form.isLunar = el.checked;
        if (!form.isLunar) form.isLeapMonth = false;
        render();
        break;
      case 'f-leap':
        form.isLeapMonth = el.checked;
        refreshDatePreview();
        break;
      default:
        break;
    }
  }

  function refreshDatePreview() {
    var holder = document.getElementById('date-preview');
    if (holder) holder.innerHTML = datePreviewHtml(form, today);
    var hint = document.getElementById('leap-hint');
    if (hint) hint.textContent = leapHintText(form, today);
  }

  function findActionable(node) {
    var current = node;
    while (current && current !== document.body) {
      if (current.getAttribute && (current.getAttribute('data-action') || current.getAttribute('data-nav'))) return current;
      current = current.parentNode;
    }
    return null;
  }

  /* 선물 링크(<a>)를 누를 때도, 떠나기 직전에 미리 적어 둔 말을 복사해 둔다.
   * 기본 동작(새 창/같은 창 열기)은 건드리지 않으려고 캡처 단계에서 듣기만 한다. */
  function onGiftLinkClick(event) {
    var node = event.target;
    var link = node && node.closest ? node.closest('[data-copy-on-open]') : null;
    if (!link) return;
    var a = modal && modal.id ? store.getAnniversary(modal.id) : null;
    if (!a) return;
    copyMessageForGift(a, null, { sync: !link.getAttribute('target') });
  }

  function onClick(event) {
    var el = findActionable(event.target);
    if (!el) return;
    event.preventDefault();
    var nav = el.getAttribute('data-nav');
    if (nav) {
      handleNav(el);
      return;
    }
    handleAction(el.getAttribute('data-action'), el);
  }

  function onKeyDown(event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var el = event.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('role') !== 'button') return;
    event.preventDefault();
    onClick({ target: el });
  }

  function mount(options) {
    var opts = options || {};
    store = opts.store || A.createStore();
    today = opts.today || A.todayISO();
    form = newForm(store.getState().settings);
    settingsBudgetText = String(store.getState().settings.defaultBudget);

    if (!location.hash) {
      try {
        history.replaceState(null, '', '#/home');
      } catch (error) {
        location.hash = '#/home';
      }
    }
    applyRoute();
    render(true);

    document.addEventListener('click', onClick, false);
    document.addEventListener('click', onGiftLinkClick, true);
    document.addEventListener('input', onInput, false);
    document.addEventListener('change', onChange, false);
    document.addEventListener('keydown', onKeyDown, false);
    window.addEventListener('hashchange', function () {
      applyRoute();
      render(true);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      var now = A.todayISO();
      if (now !== today) {
        today = now;
        render();
      }
    });
  }

  return {
    mount: mount,
    screens: {
      home: renderHomeScreen,
      add: renderAddScreen,
      detail: renderDetailScreen,
      reminder: renderReminderScreen,
      settings: renderSettingsScreen
    },
    helpers: {
      esc: esc,
      datePreviewHtml: datePreviewHtml,
      leapHintText: leapHintText,
      newForm: newForm,
      budgetOf: budgetOf
    }
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ANN: ANN, UI: UI };
}

</script>
<script>
(function () {
  function showFatal(error) {
    var screen = document.getElementById('screen');
    if (!screen) return;
    screen.innerHTML =
      '<section class="card"><p class="empty-title">화면을 열지 못했어요</p>' +
      '<p class="note">' + String((error && error.message) || error) + '</p>' +
      '<p class="note">브라우저(Chrome 등)에서 이 파일을 다시 열어 주세요.</p></section>';
  }
  try {
    UI.mount();
  } catch (error) {
    showFatal(error);
  }
})();
</script>
</body>
</html>
